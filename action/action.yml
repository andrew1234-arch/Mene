name: "Mene — hijacked npm package check"
description: "Fails the build when package-lock.json contains a version that a quorum of trusted witnesses has flagged on Arkiv."
author: "Mene"
branding:
  icon: "shield"
  color: "yellow"
inputs:
  lockfile:
    description: "Path to package-lock.json"
    default: "package-lock.json"
  issuers:
    description: "Comma-separated trusted witness addresses (defaults to the Mene demo witnesses)"
    default: ""
  threshold:
    description: "How many witnesses must confirm (default: mene.config.json, else 2)"
    default: ""
  min-severity:
    description: "low | moderate | high | critical (default: mene.config.json, else low)"
    default: ""
  rpc-url:
    description: "Arkiv RPC URL (default: Tiramisu)"
    default: ""
outputs:
  matches:
    description: "Number of poisoned packages found"
runs:
  using: "node24"
  main: "dist/index.mjs"
