# On-chain spikes and demo seeding, run from GitHub (which can reach Tiramisu).
# Needs repository secrets: MENE_ISSUER_A_KEY, MENE_ISSUER_B_KEY, MENE_ISSUER_C_KEY,
# MENE_KEEPER_KEY — funded Tiramisu testnet keys only. Order: spike → mirror → seed → attack.
name: arkiv-onchain
on:
  workflow_dispatch:
    inputs:
      task:
        description: "spike, mirror, seed, or attack"
        required: true
        default: spike
        type: choice
        options: [spike, mirror, seed, attack]
      seal_mode:
        description: "seed only: batch | separate | none (use separate if spike S1 fails)"
        required: false
        default: batch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      MENE_ISSUER_A_KEY: ${{ secrets.MENE_ISSUER_A_KEY }}
      MENE_ISSUER_B_KEY: ${{ secrets.MENE_ISSUER_B_KEY }}
      MENE_ISSUER_C_KEY: ${{ secrets.MENE_ISSUER_C_KEY }}
      MENE_KEEPER_KEY: ${{ secrets.MENE_KEEPER_KEY }}
      MENE_SEAL_MODE: ${{ github.event.inputs.seal_mode }}
      TASK: ${{ github.event.inputs.task }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Addresses (public only)
        run: npx tsx scripts/addresses.ts
      - name: Run ${{ github.event.inputs.task }}
        shell: bash
        run: |
          set -o pipefail
          case "$TASK" in spike|mirror|seed|attack) ;; *) echo "unknown task: $TASK"; exit 1 ;; esac
          npm run "$TASK" 2>&1 | tee onchain.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: onchain-${{ github.event.inputs.task }}
          path: onchain.log
      - name: Commit results (evidence + witness addresses)
        if: always()
        shell: bash
        run: |
          git config user.name "mene-seed"
          git config user.email "mene-seed@users.noreply.github.com"
          git add -A arkiv/evidence.md arkiv/friction.md packages/cli/src/witnesses.ts site/src/data/witnesses.json action/dist
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore: record $TASK run (evidence)"
          git push
