# Read-only checks against the live Tiramisu node. No keys needed.
name: arkiv-smoke
on:
  workflow_dispatch:
    inputs:
      witnesses:
        description: "Witness addresses to read (space-separated). Default: the configured demo witnesses."
        required: false
      snapshot:
        description: "Also print the resolved advisories as a base64 JSON line (for offline site screenshots)"
        type: boolean
        default: false
  push:
    paths: ["packages/sdk/src/**", "scripts/smoke.ts", ".github/workflows/arkiv-smoke.yml"]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Browser access (CORS)
        # The site calls the RPC straight from the browser, so the node must allow cross-origin requests.
        shell: bash
        run: |
          RPC=https://rpc.tiramisu.db-chain.testnet.arkiv.network
          ORIGIN=https://mene-demo.vercel.app
          echo "--- preflight (OPTIONS)"
          curl -sS -o /dev/null -D - -X OPTIONS "$RPC" -H "Origin: $ORIGIN" \
            -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type" | tee pre.txt
          echo "--- request (POST)"
          curl -sS -D - "$RPC" -H "Origin: $ORIGIN" -H "content-type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' | tee post.txt
          if grep -qi "^access-control-allow-origin: \(\*\|$ORIGIN\)" pre.txt && grep -qi "^access-control-allow-origin" post.txt; then
            echo "CORS: browsers on any origin can read Arkiv"
          else
            echo "::error::RPC does not allow cross-origin requests"
            exit 1
          fi
      - name: Query Tiramisu
        shell: bash
        env:
          WITNESSES: ${{ github.event.inputs.witnesses }}
          MENE_SNAPSHOT: ${{ github.event.inputs.snapshot == 'true' && '1' || '' }}
        run: |
          set -o pipefail
          W="$WITNESSES"
          if [ -z "$W" ]; then W=$(node -e "const s=require('fs').readFileSync('site/src/data/witnesses.json','utf8');console.log(JSON.parse(s).map(w=>w.address).join(' '))"); fi
          # Only pass well-formed addresses through to the script.
          ARGS=()
          for a in $W; do [[ "$a" =~ ^0x[0-9a-fA-F]{40}$ ]] && ARGS+=("$a") || echo "skipping invalid address: $a"; done
          npx tsx scripts/smoke.ts "${ARGS[@]}" | tee smoke.log
      - uses: actions/upload-artifact@v6
        with: { name: smoke-log, path: smoke.log }
