# Demo: the Mene Action against a poisoned lockfile (must FAIL) and a clean one (must PASS).
# The fixtures are scanned, never installed. Runs on demand, once the demo witnesses are seeded.
name: chalk-attack-demo
on:
  workflow_dispatch:
jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: chalk-attack
            expect: failure
          - fixture: clean
            expect: success
    runs-on: ubuntu-latest
    name: mene · ${{ matrix.fixture }} (expect ${{ matrix.expect }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/mene-cache
          key: mene-cache-${{ github.run_id }}-${{ matrix.fixture }}
          restore-keys: mene-cache-
      - id: mene
        uses: ./action
        continue-on-error: true
        with:
          lockfile: examples/${{ matrix.fixture }}/package-lock.json
      - name: Check the outcome
        run: |
          echo "Mene step: ${{ steps.mene.outcome }} (matches: ${{ steps.mene.outputs.matches }}), expected: ${{ matrix.expect }}"
          test "${{ steps.mene.outcome }}" = "${{ matrix.expect }}"
          # A poisoned run must fail because of matches, not because Mene couldn't verify (exit 2).
          if [ "${{ matrix.expect }}" = "failure" ]; then test "${{ steps.mene.outputs.matches }}" -ge 1; fi
